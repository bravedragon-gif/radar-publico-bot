name: Publish reviewed briefing
on:
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: Successful preview workflow run ID
        required: true
      approved_sha256:
        description: SHA256 of the reviewed briefing.json artifact
        required: true
permissions:
  contents: read
  id-token: write
  actions: read
concurrency:
  group: radar-briefing-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: briefing-publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISH_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # v2
        id: secrets
        with:
          secrets: |-
            token:dodfpmdfbot/TELEGRAM_BOT_TOKEN/${{ vars.TELEGRAM_TOKEN_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: briefing-preview-${{ inputs.preview_run_id }}
          path: artifacts
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}
      - name: Publish exact reviewed artifact
        env:
          APPROVED_SHA: ${{ inputs.approved_sha256 }}
          BRIEFING_PUBLICATION_ENABLED: ${{ vars.BRIEFING_PUBLICATION_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ steps.secrets.outputs.token }}
        run: python -m app.briefing --publish artifacts/briefing.json --approved-sha "$APPROVED_SHA"
