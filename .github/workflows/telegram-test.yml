name: Telegram channel smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  send-test:
    if: github.ref == 'refs/heads/main'
    environment: telegram-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISH_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # v2
        id: secrets
        with:
          secrets: |-
            token:dodfpmdfbot/TELEGRAM_BOT_TOKEN/${{ vars.TELEGRAM_TOKEN_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Send controlled test message
        run: python -m app.test_telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ steps.secrets.outputs.token }}
          TELEGRAM_CHANNEL_ID: '@logisticapmdf'
