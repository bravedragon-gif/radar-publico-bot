name: Deploy Cloud Run
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  deploy:
    needs: verify
    environment: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: dodfpmdfbot
      REGION: southamerica-east1
      IMAGE: southamerica-east1-docker.pkg.dev/dodfpmdfbot/radar-publico-bot/app
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate deployment inputs
        shell: bash
        run: |
          [[ "$RUNTIME_SA" == *@dodfpmdfbot.iam.gserviceaccount.com ]]
          [[ "$DEPLOY_SA" == *@dodfpmdfbot.iam.gserviceaccount.com ]]
          [[ "$DEPLOY_SA" != "$RUNTIME_SA" ]]
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Build and push immutable image
        shell: bash
        run: |
          gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
          echo "DEPLOY_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Update only Radar service
        shell: bash
        run: |
          gcloud run services update radar-publico-bot \
            --image "$DEPLOY_IMAGE" --project "$PROJECT" --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --min 0 --max 1 --min-instances 0 --max-instances 1 \
            --memory 512Mi --cpu 1 --cpu-throttling --no-cpu-boost \
            --concurrency 1 --timeout 60 \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=dodfpmdfbot,TELEGRAM_CHANNEL_ID=@logisticapmdf,QUERIES_ENABLED=true,GLOBAL_DAILY_UPDATES=1500,GLOBAL_DAILY_EXTERNAL=400" \
            --quiet
      - name: Liveness check
        run: curl --fail --max-time 30 --retry 2 https://radar-publico-bot-389001780280.southamerica-east1.run.app/health
