name: Deploy Cloud Run
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy source to Cloud Run
        run: |
          gcloud run deploy radar-publico-bot \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region southamerica-east1 \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars "TELEGRAM_CHANNEL_ID=@logisticapmdf" \
            --set-secrets "TELEGRAM_BOT_TOKEN=radar-telegram-token:latest,TELEGRAM_WEBHOOK_SECRET=radar-webhook-secret:latest,ALLOWED_TELEGRAM_USER_IDS=radar-allowed-user-ids:latest" \
            --allow-unauthenticated \
            --quiet
